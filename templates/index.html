<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Resume Matcher</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navBar shadow-sm">
    <div class="container">
      <a class="navbar-brand text-white fw-bold" href="#">Resume Matcher</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link navLink active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link navLink" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link navLink" href="#">Features</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main body -->
  <div class="container my-5 d-flex justify-content-center align-items-center min-vh-90">
    <div class="card p-4 shadow-sm form-card" style="width: 100%; max-width: 600px;">
      <h2 class="text-center mb-4 heading">Resume vs Job Description Matcher</h2>

      <form id="matchForm" action="/" method="post" enctype="multipart/form-data" class="form">
        <div class="mb-3">
          <label class="form-label">Upload Resume (PDF)</label>
          <input class="form-control" type="file" name="resume" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Paste Job Description:</label>
          <textarea class="form-control" name="jd_text" rows="6" required></textarea>
        </div>

        <div class="d-grid">
          <button class="btn btn-primary match_button mt-3" type="submit">Match Now</button>
        </div>
      </form>
      <!-- Spinner -->
      <div id="loading" class="text-center mt-4" style="display: none;">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Matching in progress... Please wait.</p>
    </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
    <script>
      document.getElementById('matchForm').addEventListener('submit', function (e) {
          document.getElementById("loading").style.display = "block";
      
          // Slight delay (100ms) before actual submit so spinner shows up
          setTimeout(() => {
              this.submit();
          }, 100);
          
          // Prevent immediate submission
          e.preventDefault();
      });
      </script>
</body>

</html>
